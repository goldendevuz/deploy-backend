networks:
  dev:

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "6000:80"  # Expose Nginx container's port 80 to host port 6000
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
    depends_on:
      - backend
    networks:
      - dev

  backend:
    build:
      context: ./backend
    networks:
      - dev