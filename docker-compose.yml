networks:
  dev:

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "6000:80"
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
    depends_on:
      - backend
    networks:
      - dev

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    networks:
      - dev